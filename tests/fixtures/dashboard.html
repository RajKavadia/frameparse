<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Workspace Settings — Acme Cloud</title>
</head>
<body>
  <nav aria-label="Workspace Sidebar">
    <a href="/projects">Projects</a>
    <a href="/billing">Billing</a>
    <a href="/settings">Settings</a>
  </nav>
  <main>
    <h1>Workspace Settings</h1>
    <form id="login-form" action="/api/auth/login" method="POST">
      <h2>Sign In</h2>
      <label for="email">Work Email</label>
      <input id="email" name="email" type="email" required placeholder="you@company.com" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" />
      <label><input type="checkbox" name="remember" checked /> Remember me</label>
      <button type="submit" data-testid="login-btn">Sign In</button>
    </form>

    <section aria-label="Danger Zone">
      <h2>Danger Zone</h2>
      <p>Deleting your workspace permanently removes all projects and API keys.</p>
      <button type="button" data-testid="delete-workspace">Delete Workspace</button>
      <button type="button" disabled data-testid="archive-btn">Archive Workspace</button>
    </section>
  </main>
</body>
</html>
